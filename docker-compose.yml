services:
  mysql:
    image: mysql:8.0
    container_name: hc_mysql_source
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: healthcare_legacy
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20
  postgres:
    image: postgres:16
    container_name: hc_postgres_target
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_target
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
